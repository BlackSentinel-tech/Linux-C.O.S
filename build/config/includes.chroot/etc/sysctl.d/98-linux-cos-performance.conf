# Linux-C.O.S performance tuning (hardening lives in 99-linux-cos-hardening.conf)
# zram is the swap: prefer it over dropping page cache
vm.swappiness = 100
vm.page-cluster = 0
vm.vfs_cache_pressure = 50
vm.dirty_ratio = 15
vm.dirty_background_ratio = 5
# IDEs, Burp, BloodHound and friends watch a lot of files
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
fs.file-max = 2097152
# scanners open many sockets; modern congestion control for transfers
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.core.somaxconn = 4096
net.ipv4.ip_local_port_range = 10240 65535
