---
# live-boot (bookworm) mounts the live medium at /run/live/medium; lb build's
# default squashfs name is filesystem.squashfs under live/. If a future
# `lb config` change alters compression/output naming, update source here to
# match -- this is the single most common thing that breaks a Calamares
# install on a live-build ISO after a build tweak.
unpack:
  - source: "/run/live/medium/live/filesystem.squashfs"
    sourcefs: "squashfs"
    destination: ""
