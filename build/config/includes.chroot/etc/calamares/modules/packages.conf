---
# Strip the live-session-only packages from the installed system.
# try_remove, not remove: with the apt backend a plain `remove` of a name
# apt doesn't know aborts the WHOLE install at the very last step -- which
# is exactly what the previous list did with "calamares-settings-linux-cos",
# a package that never existed (our settings ship as plain files under
# includes.chroot, not as a .deb).
backend: apt

operations:
  - try_remove:
    - calamares
    - calamares-settings-debian
    - live-boot
    - live-boot-initramfs-tools
    - live-config
    - live-config-systemd
    - live-tools

update_db: false
