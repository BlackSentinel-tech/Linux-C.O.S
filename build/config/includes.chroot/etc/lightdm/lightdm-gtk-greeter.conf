[greeter]
background = /usr/share/backgrounds/linux-cos/dual.jpg
user-background = false
theme-name = COS-Dual
icon-theme-name = Papirus-Dark
font-name = Inter 11
xft-antialias = true
xft-hintstyle = hintslight
xft-rgba = rgb
indicators = ~host;~spacer;~clock;~spacer;~language;~session;~a11y;~power
clock-format = %a %d %b  ·  %H:%M
position = 50%,center 58%,center
default-user-image = /usr/share/icons/hicolor/256x256/apps/linux-cos.png
panel-position = top
hide-user-image = false
round-user-image = true
