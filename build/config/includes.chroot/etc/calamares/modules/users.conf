---
defaultGroups:
  - users
  - sudo
  - docker
  - wireshark
  - plugdev
  - netdev

autologinGroup:  autologin
doAutologin:     false
# zsh is the Linux-C.O.S shell (prompt, plugins, BlackArch command-not-found)
userShell:       /usr/bin/zsh
sudoersGroup:    sudo
setRootPassword: true
doReusePassword: false
passwordRequirements:
  minLength: 8
avatarFilePath: ""
