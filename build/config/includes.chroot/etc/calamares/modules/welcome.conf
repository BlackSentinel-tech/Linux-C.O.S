---
showSupportUrl:         true
showKnownIssuesUrl:     true
showReleaseNotesUrl:    false
showDonateUrl:          false

requirements:
  # the installed system alone is ~41 GB (apt's own figure in the first real
  # build log); 60 leaves room for updates, logs and Docker images
  requiredStorage:   60
  requiredRam:       2
  # http.kali.org is where every package comes from (Kali-rolling base)
  internetCheckUrl:  https://http.kali.org
  check:
    - storage
    - ram
    - power
    - internet
  required:
    - storage
    - ram
