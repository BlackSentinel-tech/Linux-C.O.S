# Linux-C.O.S blue-team stack: MISP (threat intel platform).
# Bring up with: cos-stacks up misp
# Passwords are NOT in this file: cos-stacks generates random ones on the
# first run (see `cos-stacks creds misp`). Running this file by hand without
# them fails on purpose instead of falling back to a shared default.
# Ports are bound to 127.0.0.1: Docker-published ports bypass ufw entirely,
# so publishing on 0.0.0.0 would expose MISP to the whole network.

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MISP_DB_ROOT_PASSWORD:?run this stack with cos-stacks up misp}
      MYSQL_DATABASE: misp
      MYSQL_USER: misp
      MYSQL_PASSWORD: ${MISP_DB_PASSWORD:?run this stack with cos-stacks up misp}
    volumes:
      - misp-db:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  misp:
    image: coolacid/misp-docker:core-latest
    depends_on: [db, redis]
    ports: ["127.0.0.1:8443:443"]
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: misp
      MYSQL_USER: misp
      MYSQL_PASSWORD: ${MISP_DB_PASSWORD:?run this stack with cos-stacks up misp}
      MISP_ADMIN_EMAIL: admin@linux-cos.local
      MISP_ADMIN_PASSPHRASE: ${MISP_ADMIN_PASSPHRASE:?run this stack with cos-stacks up misp}
      MISP_BASEURL: https://localhost:8443
      REDIS_FQDN: redis
    volumes:
      - misp-data:/var/www/MISP
    restart: unless-stopped

volumes:
  misp-db:
  misp-data:
