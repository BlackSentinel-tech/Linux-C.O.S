---
# unpackfs just copied the live session's filesystem verbatim onto the new
# disk, marker files and all -- if someone poked around the live session
# before installing, linux-cos-firstboot would think it already ran on a
# machine that's never actually booted for real yet. Reset it here so the
# freshly-installed system gets a genuine first boot.
dontChroot: false
timeout: 30
script:
  - "rm -rf /var/lib/linux-cos"
  - "update-initramfs -u"
