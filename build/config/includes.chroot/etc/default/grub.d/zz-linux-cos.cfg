# Linux-C.O.S -- GRUB look & name on installed systems. "zz-" so it is
# sourced after kali-themes' own grub.d snippet and wins over its theme.
# Only the look is set here: the kernel command line and the timeout belong
# to the installer (Calamares grubcfg/bootloader write them into
# /etc/default/grub, e.g. resume=UUID=... for the swap choice), so append
# to them instead of replacing them.
GRUB_DISTRIBUTOR="Linux-C.O.S"
GRUB_THEME="/usr/share/grub/themes/linux-cos/theme.txt"
GRUB_GFXMODE="auto"
case " ${GRUB_CMDLINE_LINUX_DEFAULT:-} " in
  *" splash "*) ;;
  *) GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:+$GRUB_CMDLINE_LINUX_DEFAULT }splash" ;;
esac
