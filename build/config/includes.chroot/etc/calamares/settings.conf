---
modules-search: [ local ]

instances:
- id:       linux-cos
  module:   packages
  config:   packages.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - grubcfg
  - bootloader
  - packages@linux-cos
  - shellprocess
  - umount
- show:
  - finished

branding: linux-cos

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
