---
# Runs inside the freshly installed system (dontChroot: false), after the
# bootloader is in place. unpackfs copied the live filesystem verbatim, so
# undo everything that only makes sense in the live session:
#
# - linux-cos-firstboot's marker: if someone poked around the live session
#   before installing, the installed system would think its first boot had
#   already happened. Reset it so it gets a genuine first boot.
# - the lightdm autologin drop-in for the live "kali" user: that account
#   does not exist on the installed system (the installer creates the real
#   user, and the users module handles autologin if it was asked for).
# - the desktop "Install Linux-C.O.S" launchers: calamares itself is
#   removed by packages.conf, so they would only be dead icons. The users
#   job ran earlier and already copied /etc/skel into the new home, so the
#   copy there goes too.
dontChroot: false
timeout: 60
script:
  - "rm -rf /var/lib/linux-cos"
  - "rm -f /etc/lightdm/lightdm.conf.d/50-linux-cos-autologin.conf"
  - "rm -f /etc/skel/Desktop/linux-cos-installer.desktop /usr/share/applications/linux-cos-installer.desktop"
  - "sh -c 'rm -f /home/*/Desktop/linux-cos-installer.desktop'"
  - "rm -f /etc/sudoers.d/live"
  # the live dock pins the installer launcher; on the installed system it no longer exists
  - "sh -c 'sed -i \"s/linux-cos-installer;//\" /etc/skel/.config/xfce4/panel/docklike.rc /home/*/.config/xfce4/panel/docklike.rc 2>/dev/null || true'"
