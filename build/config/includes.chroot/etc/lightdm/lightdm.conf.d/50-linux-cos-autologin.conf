# Linux-C.O.S -- autologin the live-session user (username=kali, set via the
# boot=live cmdline in auto/config) straight to the desktop, same as
# Kali/Ubuntu live sessions do. Without this, lightdm's own PAM stack
# refuses the blank password live-config gives that account by default --
# `username=` alone does NOT get you graphical autologin for free with
# lightdm specifically (unlike gdm3/sddm, which live-config handles out of
# the box). We ALSO give kali a real password (see
# includes.chroot/etc/systemd/system/linux-cos-live-password.service) so
# that manually logging in still works if autologin is ever off (VM
# snapshot booted mid-session, autologin disabled by a user, etc).
[Seat:*]
autologin-user=kali
autologin-user-timeout=0
autologin-session=xfce
